name: Unzip Website
on:
  push:
    paths:
      - '*.zip'
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip and clean up
        run: |
          for f in *.zip; do
            unzip -o "$f" -d .
            rm "$f"
          done
      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Auto-extract uploaded zip" || echo "Nothing to commit"
          git push
